name: Setup PHP Environment
description: 'Setup PHP environment'

inputs:
  github-token:
    description: 'GitHub token'
    required: true
  composer-auth-json:
    description: 'Composer auth'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        tools: composer:v2
        # TODO extensions uit github var halen?
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, mysqli, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: none
        github-token: ${{ inputs.github-token }}
      env:
        runner: self-hosted
        COMPOSER_AUTH_JSON: ${{ inputs.composer-auth-json }}

    - name: Install composer dependencies
      shell: bash
      run: composer install --prefer-dist --no-interaction