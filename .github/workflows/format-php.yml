name: PHP CS Fixer

on:
  workflow_call:
    inputs:
      php-version:
        description: 'The PHP version used to run the workflow.'
        required: false
        type: string
        default: '8.2'
      php-cs-fixer-ignore-env:
        description: 'Set to true to ignore PHP CS Fixer PHP version requirement'
        required: false
        type: string
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-cs-fixer:
    name: php-cs-fixer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP and install Composer dependencies
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ inputs.php-version }}
          composer-command: composer install --prefer-dist --no-interaction
          yard-bot-pat: ${{ secrets.YARD_BOT_PAT }}
          ypackagist-api-key: ${{ secrets.YPACKAGIST_API_KEY }}
          ypackagist-password: ${{ secrets.YPACKAGIST_PASSWORD }}
          satis-username: ${{ secrets.SATIS_USERNAME }}
          satis-password: ${{ secrets.SATIS_PASSWORD }}

      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix
        env:
          PHP_CS_FIXER_IGNORE_ENV: ${{ inputs.php-cs-fixer-ignore-env }}

      - name: "Import GPG key"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_commit_gpgsign: true
          git_user_signingkey: true

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: apply php-cs-fixer changes'
          push_options: '--force'
          commit_options: '--gpg-sign'
          commit_author: "${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>"
          commit_user_name: ${{ steps.import-gpg.outputs.name }}
          commit_user_email: ${{ steps.import-gpg.outputs.email }}
        env:
          GITHUB_TOKEN: ${{ secrets.YARD_BOT_PAT }}
