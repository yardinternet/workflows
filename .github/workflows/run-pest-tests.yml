name: Run Pest tests

on:
  workflow_call:
    inputs:
      laravel-versions:
        description: 'Json array of Laravel major constraints. Default = Acorn generations (acorn 4 = L10, acorn 5 = L12). Add "11.*" for non-acorn packages that support Laravel 11.'
        default: '["10.*","12.*"]'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ${{ fromJSON(inputs.laravel-versions) }}
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: '8.4'
            laravel: '10.*'
          - php: '8.5'
            laravel: '10.*'
          - php: '8.5'
            laravel: '11.*'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, xdebug
          coverage: none
          tools: composer:v2
          github-token: ${{ secrets.YARD_BOT_PAT }}
        env:
          COMPOSER_AUTH_JSON: |
            {
              "http-basic": {
                "packagist.yard.nl": {
                  "username": "${{ secrets.YPACKAGIST_API_KEY }}",
                  "password": "${{ secrets.YPACKAGIST_PASSWORD }}"
                },
                "satis.yard.nl": {
                  "username": "${{ secrets.SATIS_USERNAME }}",
                  "password": "${{ secrets.SATIS_PASSWORD }}"
                }
              }
            }

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Allow advisory-affected framework versions (compatibility testing, not deployment)
        run: composer config --global policy.advisories.block false

      - name: Install dependencies (pin the Laravel generation via testbench)
        run: |
          case "${{ matrix.laravel }}" in
            10.*) TESTBENCH="^8.37" ;;
            11.*) TESTBENCH="^9.16" ;;
            12.*) TESTBENCH="^10.9" ;;
            13.*) TESTBENCH="^11.0" ;;
            *) echo "Unsupported Laravel version: ${{ matrix.laravel }}"; exit 1 ;;
          esac
          composer require "orchestra/testbench:${TESTBENCH}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest
