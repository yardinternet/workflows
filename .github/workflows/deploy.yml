name: Deploy
on: 
    workflow_call:
        inputs:
            environment:
                required: true
                type: string
                default: production
                description: Deployment environment

concurrency:
  group: deploy
  queue: max

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    steps:
      - uses: yardinternet/workflows/deploy@main
        with:
          github-token: ${{ secrets.YARD_BOT_PAT }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          selector: stage=${{ inputs.environment }}
          known-hosts: ${{ vars.KNOWN_HOSTS }}
          composer-auth-json: |
                    {
                      "http-basic": {
                        "packagist.yard.nl": {
                          "username": "${{ secrets.YPACKAGIST_API_KEY }}",
                          "password": "${{ secrets.YPACKAGIST_PASSWORD }}"
                        },
                        "satis.yard.nl": {
                            "username": "${{ secrets.SATIS_USERNAME }}",
                            "password": "${{ secrets.SATIS_PASSWORD }}"
                        }
                      }
                    }