name: Format PHP
description: 'Run PHP CS Fixer'

inputs:
  php-cs-fixer-ignore-env:
    description: 'Ignore env for PHP CS Fixer'
    required: true
  gpg-private-key:
    description: 'GPG private key'
    required: true
  gpg-passphrase:
    description: 'GPG passphrase'
    required: true
  github-token:
    description: 'GitHub token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Run PHP CS Fixer
      shell: bash
      run: ./vendor/bin/php-cs-fixer fix
      env:
        PHP_CS_FIXER_IGNORE_ENV: ${{ inputs.php-cs-fixer-ignore-env }}
    - name: "Import GPG key"
      id: import-gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
          gpg_private_key: ${{ inputs.gpg-private-key }}
          passphrase: ${{ inputs.gpg-passphrase }}
          git_commit_gpgsign: true
          git_user_signingkey: true

    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'style: apply php-cs-fixer changes'
        push_options: '--force'
        commit_options: '--gpg-sign'
        commit_author: "${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>"
        commit_user_name: ${{ steps.import-gpg.outputs.name }}
        commit_user_email: ${{ steps.import-gpg.outputs.email }}
      env:
          GITHUB_TOKEN: ${{ inputs.github-token }}

